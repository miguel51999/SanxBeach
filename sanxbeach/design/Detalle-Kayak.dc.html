<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SanxBeach – Kayak</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;}
a{text-decoration:none;}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;padding:28px 20px 28px;display:flex;flex-direction:column;gap:20px;background:#F9F9FF;color:#191C20;font-family:'Figtree',system-ui,sans-serif;overflow:hidden">

  <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:48px;position:relative;z-index:5;flex-shrink:0">
    <a href="Alquiler.dc.html" aria-label="Volver a alquiler" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:22px;background:#E7E8EE;justify-self:start">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#191C20" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>
    </a>
    <a href="Main.dc.html" aria-label="SanxBeach, inicio" style="font-size:28px;font-weight:800;letter-spacing:-0.5px;color:#415F91;line-height:1">Sanx<span style="color:#006874">Beach</span></a>
    <div style="position:relative;justify-self:end">
      <button onClick="{{toggleMenu}}" aria-expanded="{{menuOpen}}" aria-haspopup="true" style="display:flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 16px;border:1px solid #74777F;border-radius:22px;background:#F9F9FF;color:#191C20;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer">
        Menú
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#44474E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transform:{{chevRot}};transition:transform .2s"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;right:0;top:52px;width:200px;box-sizing:border-box;padding:8px;display:flex;flex-direction:column;gap:2px;background:#F3F3FA;border:1px solid #C4C6D0;border-radius:16px;box-shadow:0 6px 20px rgba(25,28,32,0.14)">
          <a href="Main.dc.html" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;color:#191C20;font-weight:500;font-size:15px">Inicio</a>
          <a href="Clases.dc.html" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;color:#191C20;font-weight:500;font-size:15px">Clases</a>
          <a href="Alquiler.dc.html" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;background:#D6E3FF;color:#284777;font-weight:700;font-size:15px">Alquiler</a>
          <a href="Conocenos.dc.html" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;color:#191C20;font-weight:500;font-size:15px">Conócenos</a>
          <a href="Contactanos.dc.html" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;color:#191C20;font-weight:500;font-size:15px">Contáctanos</a>
        </div>
      </sc-if>
    </div>
  </div>

  <div style="height:340px;border-radius:28px;overflow:hidden;flex-shrink:0;background:#ECF0FF">
    <svg viewBox="0 0 350 340" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block" aria-label="Kayak" role="img">
      <rect width="350" height="340" fill="#ECF0FF"></rect>
      <g transform="translate(175 170) scale(1.2) translate(-175 -84)">
        <circle cx="175" cy="84" r="68" fill="#FFFFFF"></circle>
        <path d="M22 84 C70 54 280 54 328 84 C280 114 70 114 22 84Z" fill="#F2A65A"></path>
        <ellipse cx="175" cy="84" rx="38" ry="14" fill="#284777"></ellipse>
        <path d="M104 30 L246 138" stroke="#191C20" stroke-width="6" stroke-linecap="round"></path>
        <ellipse cx="96" cy="24" rx="8" ry="19" transform="rotate(-52 96 24)" fill="#191C20"></ellipse>
        <ellipse cx="254" cy="144" rx="8" ry="19" transform="rotate(-52 254 144)" fill="#191C20"></ellipse>
      </g>
    </svg>
  </div>

  <h1 style="margin:0;font-size:30px;font-weight:800;letter-spacing:-0.4px;line-height:1.1;color:#191C20">Kayak</h1>

  <p style="margin:0;font-size:17px;font-weight:500;line-height:1.5;color:#44474E">Explora calas y rincones del litoral a tu ritmo. Un kayak cómodo y fácil de manejar para vivir una aventura sobre el agua, solo o en buena compañía.</p>

  <div style="display:flex;gap:12px;margin-top:auto;flex-shrink:0">
    <a href="Alquilar.dc.html" style="flex:1;display:flex;align-items:center;justify-content:center;height:56px;border-radius:28px;background:#006874;color:#FFFFFF;font-size:17px;font-weight:700">Alquilar</a>
    <a href="Contactanos.dc.html" style="flex:1;display:flex;align-items:center;justify-content:center;height:56px;border-radius:28px;background:#9EEFFD;color:#004F58;font-size:17px;font-weight:700">Contáctanos</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menu: false };
  }
  renderVals() {
    return {
      menuOpen: this.state.menu,
      chevRot: this.state.menu ? 'rotate(180deg)' : 'rotate(0deg)',
      toggleMenu: () => this.setState((st) => ({ menu: !st.menu }))
    };
  }
}
</script>
</body>
</html>

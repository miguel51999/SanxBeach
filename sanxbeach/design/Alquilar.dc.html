<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SanxBeach – Alquilar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;}
a{text-decoration:none;}
input::placeholder{color:#5C5E65;opacity:1;}
input:focus,select:focus{outline:2px solid #415F91;outline-offset:1px;}
</style>
</helmet>
<div style="position:relative;width:390px;height:1090px;box-sizing:border-box;padding:28px 20px 32px;display:flex;flex-direction:column;gap:20px;background:#F9F9FF;color:#191C20;font-family:'Figtree',system-ui,sans-serif;overflow:hidden">

  <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:48px;position:relative;z-index:5;flex-shrink:0">
    <a href="Alquiler.dc.html" aria-label="Volver atrás" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:22px;background:#E7E8EE;justify-self:start">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#191C20" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>
    </a>
    <a href="Main.dc.html" aria-label="SanxBeach, inicio" style="font-size:28px;font-weight:800;letter-spacing:-0.5px;color:#415F91;line-height:1">Sanx<span style="color:#006874">Beach</span></a>
    <div style="position:relative;justify-self:end">
      <button onClick="{{toggleMenu}}" aria-expanded="{{menuOpen}}" aria-haspopup="true" style="display:flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 16px;border:1px solid #74777F;border-radius:22px;background:#F9F9FF;color:#191C20;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer">
        Menú
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#44474E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transform:{{chevRot}};transition:transform .2s"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;right:0;top:52px;width:200px;box-sizing:border-box;padding:8px;display:flex;flex-direction:column;gap:2px;background:#F3F3FA;border:1px solid #C4C6D0;border-radius:16px;box-shadow:0 6px 20px rgba(25,28,32,0.14)">
          <a href="Main.dc.html" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;color:#191C20;font-weight:500;font-size:15px">Inicio</a>
          <a href="Clases.dc.html" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;color:#191C20;font-weight:500;font-size:15px">Clases</a>
          <a href="Alquiler.dc.html" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;background:#D6E3FF;color:#284777;font-weight:700;font-size:15px">Alquiler</a>
          <a href="Conocenos.dc.html" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;color:#191C20;font-weight:500;font-size:15px">Conócenos</a>
          <a href="Contactanos.dc.html" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;color:#191C20;font-weight:500;font-size:15px">Contáctanos</a>
        </div>
      </sc-if>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px">
    <div style="font-size:14px;font-weight:500;color:#44474E">Todos los campos son obligatorios.</div>
    <sc-for list="{{fields}}" as="f" hint-placeholder-count="5">
      <label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:#44474E">
        {{ f.label }}
        <input type="{{ f.type }}" placeholder="{{ f.ph }}" value="{{ f.value }}" onInput="{{ f.onInput }}" style="box-sizing:border-box;width:100%;height:52px;padding:0 16px;border:1px solid #74777F;border-radius:14px;background:#F9F9FF;color:#191C20;font-family:inherit;font-size:16px;font-weight:500">
      </label>
    </sc-for>
  </div>

  <label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:#44474E">
    Método de pago
    <div style="position:relative">
      <select value="{{pay}}" onChange="{{onPay}}" style="box-sizing:border-box;width:100%;height:52px;padding:0 44px 0 16px;border:1px solid #74777F;border-radius:14px;background:#F9F9FF;color:#191C20;font-family:inherit;font-size:16px;font-weight:500;appearance:none;-webkit-appearance:none">
        <option value="">Selecciona una opción</option>
        <option value="tarjeta">Tarjeta</option>
        <option value="efectivo">Efectivo</option>
      </select>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#44474E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;right:14px;top:16px;pointer-events:none" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </div>
  </label>

  <sc-if value="{{isCard}}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;gap:14px;padding:16px;border:1px solid #C4C6D0;border-radius:20px;background:#F3F3FA">
      <label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:#44474E">
        Nombre completo
        <input type="text" placeholder="Como aparece en la tarjeta" value="{{cNombre.value}}" onInput="{{cNombre.onInput}}" style="box-sizing:border-box;width:100%;height:52px;padding:0 16px;border:1px solid #74777F;border-radius:14px;background:#F9F9FF;color:#191C20;font-family:inherit;font-size:16px;font-weight:500">
      </label>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:#44474E">
        Número de tarjeta
        <input type="text" inputmode="numeric" placeholder="0000 0000 0000 0000" value="{{cNumero.value}}" onInput="{{cNumero.onInput}}" style="box-sizing:border-box;width:100%;height:52px;padding:0 16px;border:1px solid #74777F;border-radius:14px;background:#F9F9FF;color:#191C20;font-family:inherit;font-size:16px;font-weight:500">
      </label>
      <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:12px">
        <label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:#44474E">
          Fecha de caducidad
          <input type="text" inputmode="numeric" placeholder="MM/AA" value="{{cCad.value}}" onInput="{{cCad.onInput}}" style="box-sizing:border-box;width:100%;height:52px;padding:0 16px;border:1px solid #74777F;border-radius:14px;background:#F9F9FF;color:#191C20;font-family:inherit;font-size:16px;font-weight:500">
        </label>
        <label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:#44474E">
          CVV
          <input type="text" inputmode="numeric" placeholder="123" value="{{cCvv.value}}" onInput="{{cCvv.onInput}}" style="box-sizing:border-box;width:100%;height:52px;padding:0 16px;border:1px solid #74777F;border-radius:14px;background:#F9F9FF;color:#191C20;font-family:inherit;font-size:16px;font-weight:500">
        </label>
      </div>
    </div>
  </sc-if>

  <button disabled="{{notReady}}" style="{{btnStyle}}">Reservar</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1090}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menu: false, nombre: '', apellidos: '', telefono: '', direccion: '', nacimiento: '', pay: '', cNombre: '', cNumero: '', cCad: '', cCvv: '' };
  }
  bind(key) {
    return { value: this.state[key], onInput: (e) => this.setState({ [key]: e.target.value }) };
  }
  renderVals() {
    const st = this.state;
    const defs = [
      ['nombre', 'Nombre', 'text', 'Tu nombre'],
      ['apellidos', 'Apellidos', 'text', 'Tus apellidos'],
      ['telefono', 'Teléfono', 'tel', '600 000 000'],
      ['direccion', 'Dirección', 'text', 'Calle, número y ciudad'],
      ['nacimiento', 'Fecha de nacimiento', 'date', '']
    ];
    const isCard = st.pay === 'tarjeta';
    const need = ['nombre', 'apellidos', 'telefono', 'direccion', 'nacimiento'];
    if (isCard) need.push('cNombre', 'cNumero', 'cCad', 'cCvv');
    const ready = st.pay !== '' && need.every((k) => String(st[k]).trim() !== '');
    const base = 'display:block;width:220px;height:56px;margin:0 auto;border:0;border-radius:28px;font-family:inherit;font-size:18px;font-weight:700;';
    return {
      menuOpen: st.menu,
      chevRot: st.menu ? 'rotate(180deg)' : 'rotate(0deg)',
      toggleMenu: () => this.setState((s) => ({ menu: !s.menu })),
      fields: defs.map(([k, label, type, ph]) => ({ label, type, ph, ...this.bind(k) })),
      pay: st.pay,
      onPay: (e) => this.setState({ pay: e.target.value }),
      isCard,
      cNombre: this.bind('cNombre'),
      cNumero: this.bind('cNumero'),
      cCad: this.bind('cCad'),
      cCvv: this.bind('cCvv'),
      notReady: !ready,
      btnStyle: ready
        ? base + 'background:#006874;color:#FFFFFF;cursor:pointer;'
        : base + 'background:#E2E2E9;color:#74777F;cursor:not-allowed;'
    };
  }
}
</script>
</body>
</html>

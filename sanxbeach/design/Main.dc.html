<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SanxBeach – Inicio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;}
a{text-decoration:none;}
input::placeholder{color:#44474E;opacity:1;}
input:focus{outline:none;}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;padding:28px 20px 24px;display:flex;flex-direction:column;gap:20px;background:#F9F9FF;color:#191C20;font-family:'Figtree',system-ui,sans-serif;overflow:hidden">

  <div style="display:flex;align-items:center;justify-content:space-between;height:48px;position:relative;z-index:5">
    <a href="#" aria-label="SanxBeach, inicio" style="font-size:28px;font-weight:800;letter-spacing:-0.5px;color:#415F91;line-height:1">Sanx<span style="color:#006874">Beach</span></a>
    <div style="position:relative">
      <button onClick="{{toggleMenu}}" aria-expanded="{{menuOpen}}" aria-haspopup="true" style="display:flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 16px;border:1px solid #74777F;border-radius:22px;background:#F9F9FF;color:#191C20;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer">
        Menú
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#44474E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transform:{{chevRot}};transition:transform .2s"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;right:0;top:52px;width:200px;box-sizing:border-box;padding:8px;display:flex;flex-direction:column;gap:2px;background:#F3F3FA;border:1px solid #C4C6D0;border-radius:16px;box-shadow:0 6px 20px rgba(25,28,32,0.14)">
          <a href="#" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;background:#D6E3FF;color:#284777;font-size:15px;font-weight:700">Inicio</a>
          <a href="Clases.dc.html" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;color:#191C20;font-size:15px;font-weight:500">Clases</a>
          <a href="Alquiler.dc.html" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;color:#191C20;font-size:15px;font-weight:500">Alquiler</a>
          <a href="Conocenos.dc.html" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;color:#191C20;font-size:15px;font-weight:500">Conócenos</a>
          <a href="Contactanos.dc.html" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;color:#191C20;font-size:15px;font-weight:500">Contáctanos</a>
        </div>
      </sc-if>
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:12px;height:52px;box-sizing:border-box;padding:0 18px;border-radius:26px;background:#E7E8EE;flex-shrink:0">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#44474E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    <input type="search" aria-label="Buscar clases o material" placeholder="Buscar clases o material" style="flex:1;min-width:0;height:100%;border:0;background:transparent;font-family:inherit;font-size:16px;color:#191C20">
  </div>

  <div style="position:relative;flex:1;min-height:0;border-radius:28px;overflow:hidden;background:#D6E3FF">

    <div style="position:absolute;inset:0;opacity:{{op0}};transition:opacity .6s">
      <svg viewBox="0 0 350 480" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block" aria-hidden="true">
        <rect width="350" height="480" fill="#D6E3FF"></rect>
        <circle cx="255" cy="120" r="52" fill="#FFFFFF"></circle>
        <rect y="210" width="350" height="270" fill="#86ACF0"></rect>
        <path d="M0 250 Q40 225 88 250 T175 250 T263 250 T350 250 V480 H0Z" fill="#5177B8"></path>
        <path d="M0 310 Q50 280 100 310 T200 310 T300 310 T400 310 V480 H0Z" fill="#415F91"></path>
        <path d="M0 372 Q60 340 120 372 T240 372 T360 372 V480 H0Z" fill="#284777"></path>
        <path d="M30 236 Q60 214 92 236" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"></path>
        <path d="M210 266 Q240 246 272 266" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"></path>
        <g transform="rotate(-24 175 300)">
          <path d="M175 168 C206 210 206 380 175 432 C144 380 144 210 175 168Z" fill="#006874"></path>
          <path d="M175 190 V412" stroke="#9EEFFD" stroke-width="6" stroke-linecap="round"></path>
        </g>
      </svg>
    </div>

    <div style="position:absolute;inset:0;opacity:{{op1}};transition:opacity .6s">
      <svg viewBox="0 0 350 480" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block" aria-hidden="true">
        <rect width="350" height="480" fill="#9EEFFD"></rect>
        <circle cx="90" cy="110" r="46" fill="#FFFFFF"></circle>
        <rect y="200" width="350" height="280" fill="#70B6C0"></rect>
        <path d="M0 240 Q45 215 90 240 T180 240 T270 240 T360 240 V480 H0Z" fill="#559BA5"></path>
        <path d="M0 300 Q55 270 110 300 T220 300 T330 300 T440 300 V480 H0Z" fill="#39818A"></path>
        <path d="M0 380 Q60 350 120 380 T240 380 T360 380 V480 H0Z" fill="#186871"></path>
        <rect x="40" y="318" width="270" height="22" rx="11" fill="#415F91"></rect>
        <rect x="60" y="324" width="230" height="5" rx="2.5" fill="#D6E3FF"></rect>
        <path d="M232 190 L196 330" stroke="#191C20" stroke-width="7" stroke-linecap="round"></path>
        <path d="M244 160 C262 164 262 200 236 206 C226 190 228 168 244 160Z" fill="#191C20"></path>
      </svg>
    </div>

    <div style="position:absolute;inset:0;opacity:{{op2}};transition:opacity .6s">
      <svg viewBox="0 0 350 480" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block" aria-hidden="true">
        <rect width="350" height="480" fill="#ECF0FF"></rect>
        <circle cx="270" cy="95" r="40" fill="#FFFFFF"></circle>
        <rect y="190" width="350" height="290" fill="#6B91D3"></rect>
        <path d="M0 232 Q50 206 100 232 T200 232 T300 232 T400 232 V480 H0Z" fill="#5177B8"></path>
        <path d="M0 296 Q55 266 110 296 T220 296 T330 296 T440 296 V480 H0Z" fill="#365E9D"></path>
        <path d="M0 376 Q60 346 120 376 T240 376 T360 376 V480 H0Z" fill="#194683"></path>
        <path d="M30 330 Q175 372 320 330 Q175 350 30 330Z" fill="#006874"></path>
        <path d="M30 330 Q175 372 320 330" fill="none" stroke="#9EEFFD" stroke-width="5" stroke-linecap="round"></path>
        <ellipse cx="175" cy="336" rx="26" ry="8" fill="#002F64"></ellipse>
        <path d="M95 292 L255 372" stroke="#191C20" stroke-width="6" stroke-linecap="round"></path>
        <path d="M82 282 C96 276 104 284 100 296 C90 298 82 292 82 282Z" fill="#191C20"></path>
        <path d="M262 366 C274 372 270 384 258 380 C252 376 254 366 262 366Z" fill="#191C20"></path>
      </svg>
    </div>

    <div style="position:absolute;left:16px;right:16px;bottom:16px;display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;align-items:center;height:36px;padding:0 16px;border-radius:18px;background:#F9F9FF;color:#191C20;font-size:15px;font-weight:700">{{slideLabel}}</div>
      <div style="display:flex;align-items:center;gap:2px;padding:0 4px;border-radius:22px;background:#F9F9FF">
        <sc-for list="{{dots}}" as="d" hint-placeholder-count="3">
          <button onClick="{{ d.pick }}" aria-label="{{ d.label }}" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;background:transparent;cursor:pointer;padding:0">
            <span style="{{ d.style }}"></span>
          </button>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="display:flex;gap:12px;flex-shrink:0">
    <a href="Clases.dc.html" style="flex:1;display:flex;align-items:center;justify-content:center;gap:10px;height:60px;border-radius:30px;background:#415F91;color:#FFFFFF;font-size:18px;font-weight:700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 17c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"></path><path d="M12 3c2 3 2 7 0 10"></path><path d="M12 3C9 5 8 9 9 13"></path></svg>
      Clases
    </a>
    <a href="Alquiler.dc.html" style="flex:1;display:flex;align-items:center;justify-content:center;gap:10px;height:60px;border-radius:30px;background:#006874;color:#FFFFFF;font-size:18px;font-weight:700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15c0-4 4-8 9-8s9 4 9 8-4 2-9 2-9 2-9-2z"></path></svg>
      Alquiler
    </a>
  </div>

  <div style="display:flex;gap:12px;flex-shrink:0">
    <a href="Conocenos.dc.html" style="flex:1;display:flex;align-items:center;justify-content:center;height:52px;border-radius:26px;background:#D6E3FF;color:#284777;font-size:16px;font-weight:700">Conócenos</a>
    <a href="Contactanos.dc.html" style="flex:1;display:flex;align-items:center;justify-content:center;height:52px;border-radius:26px;background:#9EEFFD;color:#004F58;font-size:16px;font-weight:700">Contáctanos</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { slide: 0, menu: false };
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      this.setState((s) => ({ slide: (s.slide + 1) % 3 }));
    }, 3000);
  }
  componentWillUnmount() {
    if (this.timer) clearInterval(this.timer);
  }
  renderVals() {
    const labels = ['Surf', 'Paddle surf', 'Kayak'];
    const s = this.state.slide;
    return {
      op0: s === 0 ? 1 : 0,
      op1: s === 1 ? 1 : 0,
      op2: s === 2 ? 1 : 0,
      slideLabel: labels[s],
      menuOpen: this.state.menu,
      chevRot: this.state.menu ? 'rotate(180deg)' : 'rotate(0deg)',
      toggleMenu: () => this.setState((st) => ({ menu: !st.menu })),
      dots: labels.map((l, i) => ({
        label: 'Ver ' + l,
        pick: () => this.setState({ slide: i }),
        style: i === s
          ? 'display:block;width:22px;height:8px;border-radius:4px;background:#415F91;transition:all .3s'
          : 'display:block;width:8px;height:8px;border-radius:4px;background:#74777F;transition:all .3s'
      }))
    };
  }
}
</script>
</body>
</html>

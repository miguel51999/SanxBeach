<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SanxBeach – Contáctanos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;}
a{text-decoration:none;}
input::placeholder,textarea::placeholder{color:#5C5E65;opacity:1;}
input:focus,textarea:focus{outline:2px solid #415F91;outline-offset:1px;}
</style>
</helmet>
<div style="position:relative;width:390px;height:1070px;box-sizing:border-box;padding:28px 20px 32px;display:flex;flex-direction:column;gap:20px;background:#F9F9FF;color:#191C20;font-family:'Figtree',system-ui,sans-serif;overflow:hidden">

  <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:48px;position:relative;z-index:5;flex-shrink:0">
    <a href="Main.dc.html" aria-label="Volver al inicio" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:22px;background:#E7E8EE;justify-self:start">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#191C20" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>
    </a>
    <a href="Main.dc.html" aria-label="SanxBeach, inicio" style="font-size:28px;font-weight:800;letter-spacing:-0.5px;color:#415F91;line-height:1">Sanx<span style="color:#006874">Beach</span></a>
    <div style="position:relative;justify-self:end">
      <button onClick="{{toggleMenu}}" aria-expanded="{{menuOpen}}" aria-haspopup="true" style="display:flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 16px;border:1px solid #74777F;border-radius:22px;background:#F9F9FF;color:#191C20;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer">
        Menú
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#44474E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transform:{{chevRot}};transition:transform .2s"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;right:0;top:52px;width:200px;box-sizing:border-box;padding:8px;display:flex;flex-direction:column;gap:2px;background:#F3F3FA;border:1px solid #C4C6D0;border-radius:16px;box-shadow:0 6px 20px rgba(25,28,32,0.14)">
          <a href="Main.dc.html" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;color:#191C20;font-weight:500;font-size:15px">Inicio</a>
          <a href="Clases.dc.html" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;color:#191C20;font-weight:500;font-size:15px">Clases</a>
          <a href="Alquiler.dc.html" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;color:#191C20;font-weight:500;font-size:15px">Alquiler</a>
          <a href="Conocenos.dc.html" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;color:#191C20;font-weight:500;font-size:15px">Conócenos</a>
          <a href="Contactanos.dc.html" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;background:#D6E3FF;color:#284777;font-weight:700;font-size:15px">Contáctanos</a>
        </div>
      </sc-if>
    </div>
  </div>

  <h1 style="margin:0;font-size:26px;font-weight:800;letter-spacing:-0.3px;line-height:1.15;color:#191C20">Estamos en</h1>

  <div style="display:flex;align-items:stretch;gap:16px;flex-shrink:0">
    <a href="https://www.google.com/maps/search/?api=1&query=Playa+de+Silgar+Sanxenxo" aria-label="Abrir la ubicación de la Playa de Silgar en el mapa" style="display:block;width:190px;height:190px;flex-shrink:0;border-radius:20px;overflow:hidden;border:1px solid #C4C6D0">
      <svg viewBox="0 0 190 190" style="width:100%;height:100%;display:block" aria-hidden="true">
        <rect width="190" height="190" fill="#D6E3FF"></rect>
        <path d="M0 92 C30 92 50 124 92 128 C132 132 160 102 190 92 V190 H0Z" fill="#EDEDF4"></path>
        <path d="M0 92 C30 92 50 124 92 128 C132 132 160 102 190 92" fill="none" stroke="#EBD9A8" stroke-width="9" stroke-linecap="round"></path>
        <path d="M-5 186 L60 150 L130 156 L195 138" fill="none" stroke="#C4C6D0" stroke-width="8" stroke-linejoin="round"></path>
        <path d="M-5 186 L60 150 L130 156 L195 138" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"></path>
        <path d="M60 150 L40 190" fill="none" stroke="#C4C6D0" stroke-width="6"></path>
        <path d="M60 150 L40 190" fill="none" stroke="#FFFFFF" stroke-width="3.5"></path>
        <path d="M130 156 L150 190" fill="none" stroke="#C4C6D0" stroke-width="6"></path>
        <path d="M130 156 L150 190" fill="none" stroke="#FFFFFF" stroke-width="3.5"></path>
        <rect x="70" y="164" width="104" height="20" rx="10" fill="#FFFFFF"></rect>
        <text x="122" y="178" text-anchor="middle" font-family="Figtree, system-ui, sans-serif" font-size="11" font-weight="700" fill="#191C20">Playa de Silgar</text>
        <circle cx="92" cy="104" r="12" fill="#BA1A1A"></circle>
        <path d="M82 110 L92 128 L102 110Z" fill="#BA1A1A"></path>
        <circle cx="92" cy="104" r="4.5" fill="#FFFFFF"></circle>
      </svg>
    </a>
    <div style="display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0">
      <div style="font-size:14px;font-weight:700;color:#44474E">Dirección</div>
      <div style="font-size:19px;font-weight:800;line-height:1.2;color:#191C20">Playa de Silgar</div>
      <div style="font-size:15px;font-weight:500;line-height:1.4;color:#44474E">Sanxenxo<br>Pontevedra, Galicia</div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:12px;flex-shrink:0">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;box-sizing:border-box;padding:0 16px;border:1px solid #C4C6D0;border-radius:18px;background:#F3F3FA">
      <div style="font-size:16px;font-weight:700;color:#191C20">Llámanos</div>
      <a href="tel:222333444" style="display:flex;align-items:center;min-height:44px;font-size:16px;font-weight:700;color:#415F91">222 333 444</a>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;box-sizing:border-box;padding:0 16px;border:1px solid #C4C6D0;border-radius:18px;background:#F3F3FA">
      <div style="font-size:16px;font-weight:700;color:#191C20;white-space:nowrap">Nuestro Mail</div>
      <a href="mailto:SanxBeach@gmail.com" style="display:flex;align-items:center;min-height:44px;font-size:15px;font-weight:700;color:#415F91;min-width:0;overflow-wrap:anywhere;text-align:right">SanxBeach@gmail.com</a>
    </div>
  </div>

  <h2 style="margin:0;font-size:22px;font-weight:800;line-height:1.15;color:#191C20">Escríbenos</h2>

  <div style="display:flex;flex-direction:column;gap:14px;padding:16px;border:1px solid #C4C6D0;border-radius:24px;background:#F3F3FA">
    <label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:#44474E">
      Nombre
      <input type="text" placeholder="Tu nombre" style="box-sizing:border-box;width:100%;height:52px;padding:0 16px;border:1px solid #74777F;border-radius:14px;background:#F9F9FF;color:#191C20;font-family:inherit;font-size:16px;font-weight:500">
    </label>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:#44474E">
      Asunto
      <input type="text" placeholder="¿Sobre qué quieres escribirnos?" style="box-sizing:border-box;width:100%;height:52px;padding:0 16px;border:1px solid #74777F;border-radius:14px;background:#F9F9FF;color:#191C20;font-family:inherit;font-size:16px;font-weight:500">
    </label>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:#44474E">
      Texto
      <textarea rows="6" placeholder="Escribe aquí tu mensaje" style="box-sizing:border-box;width:100%;height:150px;padding:14px 16px;border:1px solid #74777F;border-radius:14px;background:#F9F9FF;color:#191C20;font-family:inherit;font-size:16px;font-weight:500;line-height:1.4;resize:none"></textarea>
    </label>
    <button style="display:block;width:180px;height:52px;margin:4px auto 0;border:0;border-radius:26px;background:#006874;color:#FFFFFF;font-family:inherit;font-size:17px;font-weight:700;cursor:pointer">Enviar</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1070}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menu: false };
  }
  renderVals() {
    return {
      menuOpen: this.state.menu,
      chevRot: this.state.menu ? 'rotate(180deg)' : 'rotate(0deg)',
      toggleMenu: () => this.setState((st) => ({ menu: !st.menu }))
    };
  }
}
</script>
</body>
</html>

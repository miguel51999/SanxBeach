<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SanxBeach – Clases</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;}
a{text-decoration:none;}
</style>
</helmet>
<div style="position:relative;width:390px;height:1320px;box-sizing:border-box;padding:28px 20px 32px;display:flex;flex-direction:column;gap:20px;background:#F9F9FF;color:#191C20;font-family:'Figtree',system-ui,sans-serif;overflow:hidden">

  <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:48px;position:relative;z-index:5">
    <a href="Main.dc.html" aria-label="Volver al inicio" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:22px;background:#E7E8EE;justify-self:start">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#191C20" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>
    </a>
    <a href="Main.dc.html" aria-label="SanxBeach, inicio" style="font-size:28px;font-weight:800;letter-spacing:-0.5px;color:#415F91;line-height:1">Sanx<span style="color:#006874">Beach</span></a>
    <div style="position:relative;justify-self:end">
      <button onClick="{{toggleMenu}}" aria-expanded="{{menuOpen}}" aria-haspopup="true" style="display:flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 16px;border:1px solid #74777F;border-radius:22px;background:#F9F9FF;color:#191C20;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer">
        Menú
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#44474E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transform:{{chevRot}};transition:transform .2s"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;right:0;top:52px;width:200px;box-sizing:border-box;padding:8px;display:flex;flex-direction:column;gap:2px;background:#F3F3FA;border:1px solid #C4C6D0;border-radius:16px;box-shadow:0 6px 20px rgba(25,28,32,0.14)">
          <a href="Main.dc.html" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;color:#191C20;font-size:15px;font-weight:500">Inicio</a>
          <a href="Clases.dc.html" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;background:#D6E3FF;color:#284777;font-size:15px;font-weight:700">Clases</a>
          <a href="Alquiler.dc.html" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;color:#191C20;font-size:15px;font-weight:500">Alquiler</a>
          <a href="Conocenos.dc.html" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;color:#191C20;font-size:15px;font-weight:500">Conócenos</a>
          <a href="Contactanos.dc.html" style="display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;color:#191C20;font-size:15px;font-weight:500">Contáctanos</a>
        </div>
      </sc-if>
    </div>
  </div>

  <div style="height:120px;border-radius:24px;overflow:hidden;flex-shrink:0;background:#D6E3FF">

      <circle cx="64" cy="40" r="15" fill="#F2C9A0"></circle>
      <path d="M49 38 C49 22 79 22 79 38 C72 31 56 31 49 38Z" fill="#5B3A29"></path>
      <circle cx="59" cy="42" r="1.8" fill="#191C20"></circle>
      <circle cx="69" cy="42" r="1.8" fill="#191C20"></circle>
      <path d="M59 47 Q64 52 69 47" fill="none" stroke="#191C20" stroke-width="1.8" stroke-linecap="round"></path>
      <ellipse cx="198" cy="64" rx="8" ry="32" fill="#FFFFFF"></ellipse>
      <path d="M198 36 V92" stroke="#415F91" stroke-width="3" stroke-linecap="round"></path>
      <rect x="164" y="80" width="6" height="14" rx="3" fill="#C98E62"></rect>
      <rect x="174" y="80" width="6" height="14" rx="3" fill="#C98E62"></rect>
      <rect x="160" y="54" width="24" height="30" rx="9" fill="#006874"></rect>
      <path d="M180 62 L191 60" stroke="#C98E62" stroke-width="5" stroke-linecap="round"></path>
      <circle cx="172" cy="40" r="15" fill="#C98E62"></circle>
      <path d="M157 38 C157 22 187 22 187 38 C180 31 164 31 157 38Z" fill="#191C20"></path>
      <circle cx="167" cy="42" r="1.8" fill="#191C20"></circle>
      <circle cx="177" cy="42" r="1.8" fill="#191C20"></circle>
      <path d="M167 47 Q172 52 177 47" fill="none" stroke="#191C20" stroke-width="1.8" stroke-linecap="round"></path>
      <ellipse cx="306" cy="64" rx="8" ry="32" fill="#006874"></ellipse>
      <path d="M306 36 V92" stroke="#9EEFFD" stroke-width="3" stroke-linecap="round"></path>
      <rect x="272" y="80" width="6" height="14" rx="3" fill="#F6D5B3"></rect>
      <rect x="282" y="80" width="6" height="14" rx="3" fill="#F6D5B3"></rect>
      <rect x="268" y="54" width="24" height="30" rx="9" fill="#415F91"></rect>
      <path d="M288 62 L299 60" stroke="#F6D5B3" stroke-width="5" stroke-linecap="round"></path>
      <circle cx="280" cy="40" r="15" fill="#F6D5B3"></circle>
      <path d="M265 38 C265 22 295 22 295 38 C288 31 272 31 265 38Z" fill="#C9772B"></path>
      <circle cx="275" cy="42" r="1.8" fill="#191C20"></circle>

      <path d="M275 47 Q280 52 285 47" fill="none" stroke="#191C20" stroke-width="1.8" stroke-linecap="round"></path>
    </svg>
  </div>

  <h1 style="margin:0;font-size:26px;font-weight:800;letter-spacing:-0.3px;line-height:1.15;color:#191C20">Disfruta de nuestras clases</h1>

  <div style="display:flex;flex-direction:column;gap:20px">

    <div style="border:1px solid #C4C6D0;border-radius:24px;background:#F3F3FA;overflow:hidden">
      <div style="height:168px;background:#D6E3FF">
        <svg viewBox="0 0 350 168" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block" aria-label="Ilustración de una tabla de surf sobre las olas" role="img">
          <rect width="350" height="168" fill="#D6E3FF"></rect>
          <circle cx="285" cy="44" r="24" fill="#FFFFFF"></circle>
          <rect y="80" width="350" height="88" fill="#86ACF0"></rect>

          <path d="M200 92 Q226 76 252 92" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"></path>

            <path d="M110 36 V152" stroke="#9EEFFD" stroke-width="5" stroke-linecap="round"></path>
          </g>
        </svg>
      </div>
      <div style="display:flex;flex-direction:column;gap:14px;padding:16px">
        <div style="font-size:22px;font-weight:800;color:#191C20;line-height:1.15">Surf</div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
          <div style="display:flex;align-items:center;gap:6px;font-size:15px;font-weight:500;color:#44474E;white-space:nowrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#44474E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
            1 h 30 min
          </div>
          <div style="display:flex;align-items:center;gap:6px;font-size:15px;font-weight:500;color:#44474E;white-space:nowrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#006874" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
            Playa del Norte
          </div>
          <a href="tel:222333444" aria-label="Llamar al 222333444 para reservar clase de surf" style="display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:24px;background:#415F91;flex-shrink:0">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"></path></svg>
          </a>
        </div>
      </div>
    </div>

    <div style="border:1px solid #C4C6D0;border-radius:24px;background:#F3F3FA;overflow:hidden">
      <div style="height:168px;background:#9EEFFD">
        <svg viewBox="0 0 350 168" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block" aria-label="Ilustración de una tabla de paddle surf con remo" role="img">

          <circle cx="70" cy="40" r="22" fill="#FFFFFF"></circle>
          <rect y="76" width="350" height="92" fill="#70B6C0"></rect>

          <rect x="60" y="102" width="230" height="20" rx="10" fill="#415F91"></rect>

        </svg>
      </div>
      <div style="display:flex;flex-direction:column;gap:14px;padding:16px">
        <div style="font-size:22px;font-weight:800;color:#191C20;line-height:1.15">Paddle surf</div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
          <div style="display:flex;align-items:center;gap:6px;font-size:15px;font-weight:500;color:#44474E;white-space:nowrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#44474E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
            1 h
          </div>
          <div style="display:flex;align-items:center;gap:6px;font-size:15px;font-weight:500;color:#44474E;white-space:nowrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#006874" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
            Bahía Azul
          </div>
          <a href="tel:222333444" aria-label="Llamar al 222333444 para reservar clase de paddle surf" style="display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:24px;background:#415F91;flex-shrink:0">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"></path></svg>
          </a>
        </div>
      </div>
    </div>

    <div style="border:1px solid #C4C6D0;border-radius:24px;background:#F3F3FA;overflow:hidden">
      <div style="height:168px;background:#ECF0FF">
        <svg viewBox="0 0 350 168" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block" aria-label="Ilustración de un kayak con remo doble" role="img">
          <rect width="350" height="168" fill="#ECF0FF"></rect>
          <circle cx="280" cy="38" r="22" fill="#FFFFFF"></circle>
          <rect y="70" width="350" height="98" fill="#6B91D3"></rect>
          <path d="M0 88 Q44 66 88 88 T176 88 T264 88 T352 88 V168 H0Z" fill="#5177B8"></path>

          <path d="M50 104 Q175 140 300 104" fill="none" stroke="#9EEFFD" stroke-width="5" stroke-linecap="round"></path>
          <ellipse cx="175" cy="108" rx="24" ry="7" fill="#002F64"></ellipse>
          <path d="M110 70 L240 140" stroke="#191C20" stroke-width="6" stroke-linecap="round"></path>
          <path d="M98 62 C112 56 120 64 116 76 C106 78 98 72 98 62Z" fill="#191C20"></path>
          <path d="M246 134 C258 140 254 152 242 148 C236 144 238 134 246 134Z" fill="#191C20"></path>
        </svg>
      </div>
      <div style="display:flex;flex-direction:column;gap:14px;padding:16px">
        <div style="font-size:22px;font-weight:800;color:#191C20;line-height:1.15">Kayak</div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
          <div style="display:flex;align-items:center;gap:6px;font-size:15px;font-weight:500;color:#44474E;white-space:nowrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#44474E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
            2 h
          </div>
          <div style="display:flex;align-items:center;gap:6px;font-size:15px;font-weight:500;color:#44474E;white-space:nowrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#006874" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
            Cala Serena
          </div>
          <a href="tel:222333444" aria-label="Llamar al 222333444 para reservar clase de kayak" style="display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:24px;background:#415F91;flex-shrink:0">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"></path></svg>
          </a>
        </div>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1320}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menu: false };
  }
  renderVals() {
    return {
      menuOpen: this.state.menu,
      chevRot: this.state.menu ? 'rotate(180deg)' : 'rotate(0deg)',
      toggleMenu: () => this.setState((st) => ({ menu: !st.menu }))
    };
  }
}
</script>
</body>
</html>
